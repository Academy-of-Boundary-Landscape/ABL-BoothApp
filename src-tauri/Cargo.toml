[package]
name = "BoothKernel"
version = "1.1.1"
description = "摊盒 - 漫展摊位管理工具"
authors = ["Renko_6626"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "booth_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# devtools: 日常开发和 release 均包含，方便现场排查
# 正式分发时可用 --no-default-features --features vision 去掉
default = ["vision", "devtools"]
vision = ["dep:ort", "dep:ndarray", "dep:image", "dep:reqwest", "dep:sha2", "dep:futures-util"]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web 服务器 & 异步运行时
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] } # 0.7 是目前主流版本
axum-server = { version = "0.7", features = ["tls-rustls"] } # LAN HTTPS 监听
rustls = { version = "0.23", default-features = false, features = ["ring"] } # rustls 0.23 要求显式选 crypto provider
tower = { version = "0.4", features = ["full"] } # Middleware support
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
rcgen = "0.13" # 自签 TLS 证书生成
thiserror = "1.0" # 派生 Error trait
time = "0.3" # rcgen 0.13 用 time::OffsetDateTime 表示证书有效期

# 数据库 (关键)
# 0.9 里 runtime-tokio-rustls 这个组合 feature 没了，拆成 runtime-tokio + 一个 tls-*。
# 这里选 tls-none：只用 sqlite 驱动，根本不走 TLS。原来的 rustls 变体会拖进一整套
# rustls 0.21 + rustls-webpki 0.101（三条未修的 RUSTSEC），换掉直接消失。
# sqlite feature 在 0.9 隐含 sqlite-bundled，交叉编译不依赖目标系统的 libsqlite3。
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-none", "sqlite", "macros", "chrono"] }

# 工具
chrono = { version = "0.4", features = ["serde"] } # 时间处理
local-ip-address = "0.5" # 获取本机 IP
# rust-embed = { version = "8.0", features = ["interpolate-folder-path"] }
include_dir = "0.7"
mime_guess = "2.0" 
jsonwebtoken = "9.2"
bcrypt = "0.15" # 密码哈希
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
rust_xlsxwriter = "0.84"
urlencoding = "2.1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.6.0"
zip = "0.6"
walkdir = "2" 
# 钉在 2.6：npm 侧的 @tauri-apps/plugin-http 只发到 2.6.1，crate 已经到 2.7.0。
# tauri CLI 2.11+ 会校验 JS 包和 Rust crate 的 major/minor 必须一致，放开就构建失败。
# 等 npm 发出 2.7 再解开。
tauri-plugin-http = "2.6"
tauri-plugin-os = "2"
dirs = "6.0.0"
tauri-plugin-app = "2.0.0-alpha.2" # 注意：尚无稳定版，仅 alpha 可用
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["load-dynamic", "copy-dylibs", "ndarray"] }
ndarray = { version = "0.16", optional = true }
image = { version = "0.25", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
futures-util = { version = "0.3", optional = true }
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi"] }

[profile.dev]
# 自己的代码保持 opt=0，编译最快
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

# 关键：依赖在 opt=1 下编译一次，缓存到 target/ 永久有效
# 第一次 build 慢一点，后续迭代链接速度会大幅提升
[profile.dev.package."*"]
opt-level = 1
debug = false

# 日常 release 构建（比原 profile 快 5-10 倍）
[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"          # 从 full LTO 改为 thin，大幅减少链接时间
opt-level = 3         # 速度优先（原来的 "z" 过于追求体积）
debug = false
strip = true

# 发布分发专用，只在真正打包 installer 时用
# 使用方法：cargo tauri build -- --profile dist
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
incremental = false
