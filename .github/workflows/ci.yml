name: CI

on:
  pull_request:
    branches: [main, 1.2-dev]
  push:
    branches: [1.2-dev]

# 同一分支上新的 push 取消上一次未跑完的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # src-tauri/src/web/mod.rs 用 include_dir! 在编译期嵌入 frontend/dist，
      # 而那个目录是 gitignore 的 —— 干净 checkout 下不先构建前端，cargo 连
      # check 都过不去（proc macro panic: "../frontend/dist" is not a directory）。
      - name: Build frontend (required by include_dir! at compile time)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      # tauri crate 需要这些系统库才能编译。
      # 注意：不需要 onnxruntime —— ort 配的是 load-dynamic，编译期不链接它。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      # 钉死版本号，和 rust-toolchain.toml 的 channel 对齐（改一处要记得改另一处，
      # 两个文件里都留了指回对方的注释）。不用 @stable：那样会额外装一套用不上的
      # stable 工具链——src-tauri/ 下的 cargo 调用照样会被 rust-toolchain.toml
      # 的 override 切到 1.98.1，@stable 装的那套等于白下。
      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        working-directory: src-tauri
        run: rustc --version && cargo --version

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features

  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 故意只装 frontend、不装仓库根：
      # 这让「frontend/package.json 必须是一份诚实的清单」成为永久守卫。
      # 一旦有人 import 了未声明的包，这一步就会红。
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Format check
        run: npm run format:check --prefix frontend

      - name: Unit tests
        run: npm run test:unit --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

  docs:
    name: Docs site (root npm ci / docs:build / version check)
    runs-on: ubuntu-latest
    # 这个 job 守的是两次真实事故：
    #   1. 某次改动动了仓库根 package.json 的 version，却没重建根
    #      package-lock.json，导致根 `npm ci` 报 EUSAGE 失败——而
    #      .github/workflows/deploy-docs.yml 第一步就是根 `npm ci`，线上文档站
    #      发布流水线因此被弄坏，且没人第一时间发现。
    #   2. `npm run docs:build`（vitepress）在 main 上挂了一天多才被人肉逮住。
    # deploy-docs.yml 带 `paths: ['docs/**', ...]` 过滤，只改根 package.json /
    # package-lock.json 而不碰 docs/ 时它根本不会触发，所以根 npm ci 和
    # docs:build 必须在这里（PR 门禁）单独兜底，不能指望那条 workflow 自己发现。
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 注意：这是仓库根的 package-lock.json，和 frontend job 用的
          # frontend/package-lock.json 不是同一份。
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Docs build
        run: npm run docs:build

      # ./scripts/set-version.sh 不带参数就是检查模式：比对
      # src-tauri/tauri.conf.json / src-tauri/Cargo.toml / frontend/package.json /
      # 根 package.json 四处版本号是否一致，一致才 exit 0。CLAUDE.md 里写的硬约束，
      # 之前没有任何门禁守它。纯 python3 + 文件读写，不依赖 tauri-env 等本机专有工具，
      # 可以直接在 CI 跑。
      - name: Version consistency check
        run: ./scripts/set-version.sh

  windows:
    name: Windows target check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # src-tauri/src/web/mod.rs 用 include_dir! 在编译期嵌入 frontend/dist，
      # 而那个目录是 gitignore 的 —— 干净 checkout 下不先构建前端，cargo 连
      # check 都过不去（proc macro panic: "../frontend/dist" is not a directory）。
      # npm ci / npm run build 都是跨平台命令，windows-latest runner 上同样能跑。
      - name: Build frontend (required by include_dir! at compile time)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      # 钉死版本号，和 rust-toolchain.toml 的 channel 对齐——理由同 rust job 那一步。
      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (Windows native)
        working-directory: src-tauri
        run: cargo check --all-features --all-targets

  android:
    name: Android target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # src-tauri/src/web/mod.rs 用 include_dir! 在编译期嵌入 frontend/dist，
      # 而那个目录是 gitignore 的 —— 干净 checkout 下不先构建前端，cargo 连
      # check 都过不去（proc macro panic: "../frontend/dist" is not a directory）。
      - name: Build frontend (required by include_dir! at compile time)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      # 钉死版本号，和 rust-toolchain.toml 的 channel 对齐——理由同 rust job 那一步。
      # 故意不在这里用 `with: targets:` 装 aarch64-linux-android：rust-toolchain.toml
      # 不再列 targets（见该文件注释），target 安装挪到下面单独一步，显式装在
      # cargo check 实际会用到的那个工具链（1.98.1）上，不依赖「这个 action 装的
      # 版本号字符串恰好和 override 解析出来的一样」这种隐式巧合。
      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # cargo check 跑在 src-tauri/ 下，会被 rust-toolchain.toml 的 override 切到
      # 1.98.1（channel 版本号，见该文件），target 必须装在这个具体工具链上——
      # 显式 --toolchain，不依赖 cwd 恰好命中 override 的隐式行为。
      - name: Add Android target
        run: rustup target add --toolchain 1.98.1 aarch64-linux-android

      # GitHub 的 ubuntu-latest runner 预装 Android SDK/NDK，ANDROID_NDK_HOME 是运行器自带的
      # 系统环境变量（不是 workflow env context，所以这里用 shell 变量而不是 ${{ env.X }} 取）。
      # zstd-sys（经 zip 0.6 传入）需要 C 交叉编译器，所以要显式指定 clang/ar。
      - name: cargo check (Android target)
        working-directory: src-tauri
        run: |
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo check --all-features --all-targets --target aarch64-linux-android
