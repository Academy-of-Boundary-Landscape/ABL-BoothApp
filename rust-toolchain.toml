[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# 钉版本会让 rustup 新建独立工具链，stable 上装好的 target 不继承。
# 不在这里列全，build-windows.sh / build-android.sh 会炸在「target 未安装」。
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
