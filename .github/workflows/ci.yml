name: CI

on:
  pull_request:
    branches: [main, 1.2-dev]
  push:
    branches: [1.2-dev]

# 同一分支上新的 push 取消上一次未跑完的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri crate 需要这些系统库才能编译。
      # 注意：不需要 onnxruntime —— ort 配的是 load-dynamic，编译期不链接它。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      # rust-toolchain.toml 钉了 1.98.1，这里不指定版本，让它读文件
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        working-directory: src-tauri
        run: rustc --version && cargo --version

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features

  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 故意只装 frontend、不装仓库根：
      # 这让「frontend/package.json 必须是一份诚实的清单」成为永久守卫。
      # 一旦有人 import 了未声明的包，这一步就会红。
      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Format check
        run: npm run format:check --prefix frontend

      - name: Unit tests
        run: npm run test:unit --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

  windows:
    name: Windows target check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (Windows native)
        working-directory: src-tauri
        run: cargo check --all-features --all-targets

  android:
    name: Android target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # GitHub 的 ubuntu-latest runner 预装 Android SDK/NDK，ANDROID_NDK_HOME 是运行器自带的
      # 系统环境变量（不是 workflow env context，所以这里用 shell 变量而不是 ${{ env.X }} 取）。
      # zstd-sys（经 zip 0.6 传入）需要 C 交叉编译器，所以要显式指定 clang/ar。
      - name: cargo check (Android target)
        working-directory: src-tauri
        run: |
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo check --all-features --all-targets --target aarch64-linux-android
